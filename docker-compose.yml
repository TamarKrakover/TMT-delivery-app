services:
  # C++ Recommendation Server Service
  server:
    build:
      context: ./cpp
      dockerfile: Dockerfile
    container_name: tmt-server
    ports:
      - "5555:5555"
    volumes:
      - ./data:/app/data
    networks:
      - tmt-net
    stdin_open: true
    tty: true
    # Override CMD to pass the port argument (5555) to the executable
    command: ["./TMTApp", "5555"]

  # Node.js Express Web Server Service
  web-server:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    container_name: tmt-web-server
    ports:
      - "8080:8080"
    environment:
      - RECOMMENDATION_SERVER_HOST=tmt-server
      - RECOMMENDATION_SERVER_PORT=5555
    depends_on:
      - server
    networks:
      - tmt-net

  # React Client Service
  client:
    build:
      context: ./react-client
      dockerfile: Dockerfile.client
    container_name: tmt-client
    ports:
      - "3000:3000"
    volumes:
      - ./react-client/src:/app/src
      - ./react-client/public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # TODO: delete before submittion- fake data for view
      - WATCHPACK_POLLING=true
    depends_on:
      - web-server
    networks:
      - tmt-net


  # C++ server unit tests Service
  tests:
    profiles:
      - test
    build:
      context: ./cpp
      dockerfile: Dockerfile
    container_name: tmt-tests
    entrypoint: ["./runTests"]
    working_dir: /app/build
    volumes:
      - ./data:/app/data
    networks:
      - tmt-net

networks:
  tmt-net:
    driver: bridge