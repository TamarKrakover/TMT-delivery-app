services:
  # C++ Server Service
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmt-server
    ports:
    # forward the host port to the container port
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
    # mount local data directory to persist database/files between restarts
      - ./data:/app/data
    networks:
      - tmt-net
    stdin_open: true
    tty: true
    # override default Dockerfile CMD to pass the dynamic port argument
    command: ["./TMTApp", "${PORT:-8080}"]

  # Python Client Service
  client:
    build:
      context: .
      dockerfile: src/client/Dockerfile.client
    container_name: tmt-client
    networks:
      - tmt-net
    stdin_open: true
    tty: true
    # passes arguments directly to the Dockerfile's ENTRYPOINT [IP, PORT]
    command: ["${IP:-server}", "${PORT:-8080}"]

  # Tests Service
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmt-tests
    # explicitly run the test suite binary instead of the standard server app
    entrypoint: ["./runTests"]
    working_dir: /app/build
    volumes:
      - ./data:/app/data
    networks:
      - tmt-net

networks:
  tmt-net:
    driver: bridge